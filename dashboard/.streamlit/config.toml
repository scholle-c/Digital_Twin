# Erzwingt das helle Design (keine dunkle Ansicht) und setzt die Grundfarben passend zum CSS.
[theme]
base = "light"
primaryColor = "#003781"
backgroundColor = "#F5F7FB"
secondaryBackgroundColor = "#EEF3F9"
textColor = "#1E293B"
font = "sans serif"

# Blendet das Streamlit-Menü für Endnutzer aus.
[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
